services:
  hwcloudpd:
    build: .
    image: hwcloudpd:latest
    container_name: hwcloudpd
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      HUAWEI_USERNAME: ${HUAWEI_USERNAME:-}
      HUAWEI_PASSWORD: ${HUAWEI_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 */2 * * *}
      HWCLOUD_DIRECTORY: /photos
      HWCLOUD_CONFIG_DIR: /config
      HWCLOUD_FOLDER_STRUCTURE: ${HWCLOUD_FOLDER_STRUCTURE:-{:%Y/%m/%d}}
      HWCLOUD_SIZE: ${HWCLOUD_SIZE:-original}
      HWCLOUD_FILE_MATCH_POLICY: ${HWCLOUD_FILE_MATCH_POLICY:-name-size-dedup-with-suffix}
      HWCLOUD_LIVE_PHOTO_POLICY: ${HWCLOUD_LIVE_PHOTO_POLICY:-none}
      HWCLOUD_UNTIL_FOUND: ${HWCLOUD_UNTIL_FOUND:-50}
      HWCLOUD_KEEPALIVE_INTERVAL: ${HWCLOUD_KEEPALIVE_INTERVAL:-60}
      HWCLOUD_DOWNLOAD_CONCURRENCY: ${HWCLOUD_DOWNLOAD_CONCURRENCY:-2}
      HWCLOUD_FULL_SCAN_INTERVAL_HOURS: ${HWCLOUD_FULL_SCAN_INTERVAL_HOURS:-168}
      HWCLOUD_SET_EXIF_DATETIME: ${HWCLOUD_SET_EXIF_DATETIME:-false}
      HWCLOUD_XMP_SIDECAR: ${HWCLOUD_XMP_SIDECAR:-false}
      HWCLOUD_ALBUMS: ${HWCLOUD_ALBUMS:-}
      HWCLOUD_EXCLUDE_ALBUMS: ${HWCLOUD_EXCLUDE_ALBUMS:-}
      HWCLOUD_SKIP_VIDEOS: ${HWCLOUD_SKIP_VIDEOS:-false}
      HWCLOUD_SKIP_PHOTOS: ${HWCLOUD_SKIP_PHOTOS:-false}
      HWCLOUD_SKIP_LIVE_PHOTOS: ${HWCLOUD_SKIP_LIVE_PHOTOS:-false}
      HWCLOUD_SKIP_BURSTS: ${HWCLOUD_SKIP_BURSTS:-false}
      HWCLOUD_ONLY_FAVORITES: ${HWCLOUD_ONLY_FAVORITES:-false}
      HWCLOUD_CREATED_AFTER: ${HWCLOUD_CREATED_AFTER:-}
      HWCLOUD_CREATED_BEFORE: ${HWCLOUD_CREATED_BEFORE:-}
      HWCLOUD_MIN_SIZE: ${HWCLOUD_MIN_SIZE:-}
      HWCLOUD_MAX_SIZE: ${HWCLOUD_MAX_SIZE:-}
      HWCLOUD_AUTO_DELETE: ${HWCLOUD_AUTO_DELETE:-false}
      HWCLOUD_KEEP_CLOUD_RECENT_DAYS: ${HWCLOUD_KEEP_CLOUD_RECENT_DAYS:-}
      HWCLOUD_WEBHOOK_URL: ${HWCLOUD_WEBHOOK_URL:-}
      HWCLOUD_TELEGRAM_CHAT_ID: ${HWCLOUD_TELEGRAM_CHAT_ID:-}
      HWCLOUD_LOG_LEVEL: ${HWCLOUD_LOG_LEVEL:-INFO}
    volumes:
      - ./config:/config
      - ./photos:/photos
